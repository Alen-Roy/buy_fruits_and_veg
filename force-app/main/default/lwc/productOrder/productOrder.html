<template>
    
    <lightning-card title="Buy Fruits &amp; Veg" icon-name="custom:custom63">

        <template lwc:if={isConfirmation}>
            <div class="confirmation-screen slds-p-around_large">
                <div class="confirmation-icon">✓</div>
                <h2 class="confirmation-title">Thank you!</h2>
                <p class="confirmation-text">Your order <strong>{confirmedOrderNumber}</strong> has been placed.</p>
                <lightning-button variant="brand" label="Continue shopping" onclick={handleContinueShopping}></lightning-button>
            </div>
        </template>

        <template lwc:elseif={isCartView}>
            <div class="cart-header slds-p-horizontal_medium slds-p-top_small">
                <lightning-button label="&lt; Back to shopping" onclick={handleBackToShopping}></lightning-button>
            </div>

            <template lwc:if={isCartEmpty}>
                <p class="slds-p-around_medium">Your cart is empty.</p>
            </template>
            <template lwc:else>
                <div class="cart-list slds-p-horizontal_medium">
                    <template for:each={cartItems} for:item="item">
                        <div key={item.productId} class="cart-row">
                            <img src={item.imageUrl} alt={item.name} class="cart-thumb" />
                            <div class="cart-info">
                                <div class="cart-name">{item.name}</div>
                                <div class="cart-price">₹{item.price} each</div>
                            </div>
                            <div class="cart-qty">
                                <lightning-button-icon icon-name="utility:dash" data-id={item.productId} onclick={handleDecrement}></lightning-button-icon>
                                <span class="qty-value">{item.quantity}</span>
                                <lightning-button-icon icon-name="utility:add" data-id={item.productId} onclick={handleIncrement}></lightning-button-icon>
                            </div>
                            <div class="cart-subtotal">₹{item.subtotal}</div>
                            <lightning-button-icon icon-name="utility:close" data-id={item.productId} onclick={handleRemove}></lightning-button-icon>
                        </div>
                    </template>
                </div>

                <div class="cart-total slds-p-around_medium">
                    <strong>Total: ₹{cartTotal}</strong>
                </div>

                <div class="slds-p-horizontal_medium">
                    <lightning-input label="Your name" value={customerName} onchange={handleNameChange}></lightning-input>
                </div>

                <div class="slds-p-around_medium">
                    <lightning-button variant="brand" label="Place order" onclick={handlePlaceOrder}></lightning-button>
                </div>
            </template>
        </template>

        <template lwc:else>
            <div class="cart-badge-bar slds-p-horizontal_medium">
                <lightning-button label={cartButtonLabel} onclick={handleViewCart}></lightning-button>
            </div>

            <div class="search-bar slds-p-horizontal_medium slds-p-top_small">
                <lightning-input type="search" label="Search products" variant="label-hidden" placeholder="Search for a fruit or vegetable..." value={searchTerm} onchange={handleSearchChange}></lightning-input>
            </div>

            <div class="filter-bar slds-p-horizontal_medium">
                <lightning-button label="All" variant={allButtonVariant} data-category="All" onclick={handleCategoryFilter}></lightning-button>
                <lightning-button label="Fruits" variant={fruitButtonVariant} data-category="Fruit" onclick={handleCategoryFilter}></lightning-button>
                <lightning-button label="Vegetables" variant={vegButtonVariant} data-category="Vegetable" onclick={handleCategoryFilter}></lightning-button>
            </div>

            <div class="product-grid">
                <template for:each={filteredProducts} for:item="product">
                    <div key={product.Id} class="product-card">
                        <img src={product.Image_URL__c} alt={product.Name} class="product-image" />
                        <div class="product-name">{product.Name}</div>
                        <div class="product-price">₹{product.Price__c}</div>
                        <lightning-button label="Add to cart" data-id={product.Id} onclick={handleAddToCart}></lightning-button>
                    </div>
                </template>
            </div>
        </template>

    </lightning-card>
</template>
